<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body
    class="min-vh-100 d-flex align-items-center justify-content-center p-4"
    style="
        background-image: url('images/visacard1.jpg');
        background-size: cover;
        background-position: center;
    "
>

    <div
        class="bg-white rounded-3 p-4 p-md-5"
        style="width: 680px; max-width: 100%;"
    >

        <h1 class="text-center fw-bold mb-1">
            Settings
        </h1>

        <p class="text-center fw-semibold mb-5">
            Payment
        </p>

        <h6 class="fw-bold mb-3">
            Saved cards:
        </h6>

        <div class="row align-items-center g-2 mb-3">

            <div class="col-auto">

                <div
                    class="bg-dark text-white rounded-2
                    d-flex align-items-center justify-content-center"
                    style="width: 52px; height: 40px;"
                >
                    <small class="fw-bold">
                        mastercard
                    </small>
                </div>

            </div>


            <div class="col">

                <div class="form-floating">

                    <input
                        type="text"
                        class="form-control"
                        id="mastercard"
                        
                    >

                    <label for="mastercard">
                        Card Number
                    </label>

                </div>

            </div>


            <div class="col-auto">

                <button
                    type="button"
                    class="btn text-primary fw-semibold"
                >
                    Remove card
                </button>

            </div>

        </div>


        <div class="row align-items-center g-2 mb-4">

            <div class="col-auto">

                <div
                    class="bg-dark text-white rounded-2
                    d-flex align-items-center justify-content-center"
                    style="width: 52px; height: 40px;"
                >
                    <strong>
                        VISA
                    </strong>
                </div>

            </div>


            <div class="col">

                <div class="form-floating">

                    <input
                        type="text"
                        class="form-control"
                        id="visa"
                        
                    >

                    <label for="visa">
                        Card Number
                    </label>

                </div>

            </div>


            <div class="col-auto">

                <button
                    type="button"
                    class="btn text-primary fw-semibold"
                >
                    Remove card
                </button>

            </div>

        </div>


        <h6 class="fw-bold mb-3">
            Add new card:
        </h6>

        <div class="form-floating mb-4">

            <input
                type="text"
                class="form-control"
                id="cardholder"
                placeholder="Cardholder's Name"
                value="mohammad matar"
            >

            <label for="cardholder">
                Cardholder's Name
            </label>

        </div>


       <div class="row g-3">


            <div class="col-md-6">

                <div class="form-floating">

                    <input
                        type="text"
                        class="form-control"
                        id="cardNumber"
                        placeholder="Card Number"
                    >

                    <label for="cardNumber">
                        Card Number
                    </label>

                </div>

            </div>

            <div class="col-md-3 col-6">

                <div class="form-floating">

                    <input
                        type="text"
                        class="form-control"
                        id="expire"
                        placeholder="MM/YY"
                    >

                    <label for="expire">
                        Expire
                    </label>

                </div>

            </div>


            <div class="col-md-3 col-6">

                <div class="form-floating">

                    <input
                        type="text"
                        class="form-control"
                        id="cvv"
                        placeholder="CVV"
                    >

                    <label for="cvv">
                        Cvv
                    </label>

                </div>

            </div>

        </div>

        <button
            type="button"
            class="btn btn-success w-100 mt-4 fw-bold py-2"
        >
            ADD CARD
        </button>

    </div>

</body>
</html>
